[package]
name = "voluma"
version = "0.1.0"
description = "Voluma - 小方工作室 PDF 工作台"
authors = ["小方工作室"]
edition = "2021"

[lib]
name = "voluma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.34"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp"] }
flate2 = "1"
ttf-parser = "0.25.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
